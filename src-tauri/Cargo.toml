[package]
name = "wlan-flash-transfer-tauri"
version = "1.2.8"
description = "局域网高速文件互传工具"
edition = "2021"

[lib]
name = "lan_transfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "CC-Flash"
path = "src/main.rs"

# 发布构建体积优化: 去符号 + LTO + 单编译单元 + 尺寸优先
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"   # 尺寸极致(实测对比 "s" 后定夺, IO 型工具 CPU 占用低)
panic = "abort"
debug = false
incremental = false
# 构建脚本用更高优化级别: 只影响构建期速度, 不增大最终产物
[profile.release.build-override]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 默认特性里 x11/dbus 只服务 Linux: 关掉默认特性后在 Linux 目标单独补回,
# macOS/Windows 不再编译/链接这部分依赖(体积与构建时间都省一截)
tauri = { version = "2", default-features = false, features = [
    "wry",
    "compression",
    "common-controls-v6",
    "dynamic-acl",
    "tray-icon",
] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# 裁掉默认特性(form/matched-path/original-uri/tracing 栈均未用到): 二进制瘦身,
# 仅保留实际用到的 http1/json/query/tokio/ws
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["cors"] }
# 自定义 accept 循环: 连接数上限 + HTTP 请求头读超时（防止未认证空连接 DoS）
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
# 本机服务只提供明文 HTTP/1.1（含 WebSocket 升级），不引入 HTTP/2 自动协商以减体积
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# compression: 前端 dist 以 DEFLATE 嵌入二进制, 静态资源体积约减半
rust-embed = { version = "8", features = ["compression"] }
percent-encoding = "2"
fs2 = "0.4"
if-addrs = { version = "0.15.0", features = ["link-local"] }
# 逐网卡指定多播出口(IP_MULTICAST_IF): std 的 UdpSocket 没有这个 setter
socket2 = "0.6"

# 开机自启 + 单实例守卫(仅桌面; 移动端无此概念, 按目标平台条件引入避免移动端编译)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# 对话框/通知只在桌面壳使用: 移动端目录选择走 HTML input, 通知走原生前台服务
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# IPv6 多播发现需要把组播出口钉到具体网卡; socket2 只接收 interface index
[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2", default-features = false, features = [
    "wry",
    "compression",
    "common-controls-v6",
    "dynamic-acl",
    "tray-icon",
    "x11",
    "dbus",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_System_SystemInformation"] }

[dev-dependencies]
# 真实 WebSocket 升级测试(自定义 HTTP/1.1 accept 循环 + with_upgrades)
tokio-tungstenite = "0.24"
