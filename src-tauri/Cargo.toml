[package]
name = "wlan-flash-transfer-tauri"
version = "1.2.3"
description = "局域网高速文件互传工具"
edition = "2021"

[lib]
name = "lan_transfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "CC-Flash"
path = "src/main.rs"

# 发布构建体积优化: 去符号 + LTO + 单编译单元 + 尺寸优先
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"   # 尺寸极致(实测对比 "s" 后定夺, IO 型工具 CPU 占用低)
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# 裁掉默认特性(form/matched-path/original-uri/tracing 栈均未用到): 二进制瘦身,
# 仅保留实际用到的 http1/json/query/tokio/ws
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
rust-embed = "8"
percent-encoding = "2"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
if-addrs = "0.15.0"

# 开机自启 + 单实例守卫(仅桌面; 移动端无此概念, 按目标平台条件引入避免移动端编译)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
