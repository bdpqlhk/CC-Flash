# 推送 v* 标签时自动构建多平台安装包并创建/补充 GitHub Release
# 覆盖: macOS 分架构双包(aarch64 + x64 的 .app/.dmg) · Windows(.msi/.exe)
#       · Android(--split-per-abi 按 4 个 ABI 分包出 .apk,
#       flavor 名映射为标准 ABI 名; 必须配置 ANDROID_KEYSTORE_* 走 release 签名,
#       缺 Secrets 直接失败 —— 正式 Release 绝不允许 debug 包混入)
# iOS: 当前未交付 —— 除 Apple 开发者账号签名外, 还需先生成 gen/apple 工程、补充本地网络权限
# (NSLocalNetworkUsageDescription/Bonjour)并适配 open_url 等壳能力; 下方 job 仅为模板
name: Release 构建

on:
  push:
    tags: ["v*"]

# 同一 tag 只允许一个运行组(不取消进行中的): scripts 推送失败会"删远端 tag 重推",
# 没有该约束时会触发第二个 run, 两条流水线互删同名资产、抢着 publish
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# GITHUB_TOKEN 默认只读, 声明 contents:write 才能创建 Release 并上传产物
permissions:
  contents: write

jobs:
  # ---- 准备: 校验版本 + 串行创建草稿 Release ----
  # 三个桌面 matrix 腿若各自 getOrCreateRelease, 可能在秒级窗口内各建一个同名草稿;
  # retryAttempts 对"都成功创建"无效。这里先单点创建/确认草稿, 后面所有腿只追加资产。
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag 与 Cargo.toml 版本一致
        id: ver
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          # 四段 tag(X.Y.Z.W) 的第四段是同一应用版本内的构建号: Cargo/semver 只存前三段
          base="$tag"
          case "$tag" in *.*.*.*) base="${tag%.*}" ;; esac
          if [ "$base" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 Cargo.toml version $ver 不一致（四段 tag 前三位应等于应用版本）"
            exit 1
          fi
          echo "版本校验通过: $GITHUB_REF_NAME (应用版本 $ver)"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: 创建/确认草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            echo "::error::Release $tag 已公开，拒绝重跑发版"
            exit 1
          fi
          if [ "$state" = "missing" ]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
              --title "CC-Flash $tag" --notes "对应标签 $tag 的自动构建产物。"
          else
            echo "草稿 Release 已存在，直接复用"
          fi

  # ---- 桌面端: tauri-action 构建 + 向既有草稿追加资产 ----
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # 分架构双包(取代 universal 单包): universal 把 arm64+x86_64 两份代码 lipo 在
          # 一起, 体积近乎双倍 —— 拆分后 Apple Silicon 用户 dmg 约减半(命名沿用 v1.1.2 先例:
          # CC-Flash_x.y.z_aarch64.dmg / CC-Flash_x.y.z_x64.dmg)。代价仅是 Release 多一个
          # 文件, 与 Android 按 ABI 分包同款逻辑; 两腿 fail-fast:false 互不连坐
          - os: macos-latest
            args: --target aarch64-apple-darwin
            arch: aarch64
          - os: macos-latest
            args: --target x86_64-apple-darwin
            arch: x64
          - os: windows-latest
            args: ""
            arch: x64-win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 macOS 目标三元组(macOS)
        # 两个 mac 腿各自只构一个架构, 但把两个目标都装上保持幂等:
        # aarch64 是 runner 宿主(默认已有), x86_64 必须显式安装
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          # 两腿 macos 目标不同(target 目录不同), 缓存键必须带上 arch 避免互相覆盖
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: 安装前端依赖
        run: npm install

      # Tauri 把"存在但为空"的 APPLE_CERTIFICATE 也当作待导入证书, 空 Secret 会直接
      # 报 Unable to decode; 这里只在证书非空时写入 GITHUB_ENV, 未配置就走未签名包。
      - name: 准备可选 macOS 签名环境
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::未配置 Apple 签名证书 Secrets，本次生成未签名/未公证的 macOS 包"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<CC_EOF"
            printf '%s\n' "$APPLE_CERTIFICATE"
            echo "CC_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD<<CC_EOF"
            printf '%s\n' "$APPLE_CERTIFICATE_PASSWORD"
            echo "CC_EOF"
          } >> "$GITHUB_ENV"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "已注入 Apple 签名/公证环境"

      # tauri-action: vite build → cargo build --release → 打包 → 上传到 Release
      # tagName 对应已推送的标签, Release 不存在则自动创建(草稿)。
      # 一律先传草稿, 由末尾 publish job 在 desktop+android 全绿后统一发布 ——
      # 否则 mac 腿 releaseDraft:false 完成即公开, Windows 挂掉时用户看到没有 Windows 包的"正式版"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内展示/更新比较使用完整四段版本(本地构建回退 Cargo 三段)
          CCFLASH_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          # Apple 签名/公证变量由上方步骤按需注入 GITHUB_ENV, 不直接传空 Secret
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CC-Flash ${{ github.ref_name }}"
          releaseBody: "对应标签 ${{ github.ref_name }} 的自动构建产物。更新说明见 Release 描述。"
          releaseDraft: true
          prerelease: false
          # 三腿并发 getOrCreateRelease 竞态兜底: 两个 mac 腿几乎同时完成时可能都"没查到
          # draft 就去创建" → 422 或拆成两个 draft; 重试会重新 list 找到已建好的 draft
          retryAttempts: 3
          args: ${{ matrix.args }}

  # ---- Android: 全架构 APK(必须用发布证书 Secrets 走 release 签名; 缺失则 job 失败) ----
  android:
    needs: [prepare, desktop]   # 草稿已由 prepare 串行建好, 再追加 APK 资产
    # desktop 任一平台失败不连坐 APK 发布; prepare 失败则不再上传; 用户手动取消时不跑
    if: ${{ always() && needs.prepare.result == 'success' && needs.desktop.result != 'cancelled' }}
    runs-on: ubuntu-latest  # runner 自带 Android SDK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: 接受 Android SDK 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: 安装/定位固定版本 Android NDK
        # 不取 runner 上的"最新"版本(head-1 会拿最旧, sort|tail 又随镜像漂移):
        # 显式固定 NDK, 与 Gradle ndkVersion(跟随 NDK_HOME)和 Rust 侧编译保持一致
        run: |
          set -e
          NDK_VERSION=27.2.12479018
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        run: npm install

      - name: 初始化 Android 工程(首次)
        if: ${{ ! hashFiles('src-tauri/gen/android/**') }}
        run: npm run tauri android init

      # Android 构建与签名(签名配置已随 src-tauri/gen/android 入库, 见 app/build.gradle.kts 的
      # signingConfigs.release, 读 CC_KEYSTORE_* 环境变量):
      # - 有发布证书 Secrets → 导出环境变量, --release 构建(固定证书, 版本间可覆盖安装, 无 debuggable)
      # - 未配置 → 退回 --debug(debug keystore 自动签名, 可直接安装但各版本证书不同, CI 出警告)
      # Secrets 生成方式(本地执行一次, 妥善备份 keystore, 丢了将无法覆盖安装升级):
      #   keytool -genkeypair -v -keystore cc-flash.keystore -alias ccflash \
      #     -keyalg RSA -keysize 2048 -validity 10950
      #   base64 -i cc-flash.keystore | pbcopy   # → ANDROID_KEYSTORE_BASE64
      #   密码/别名分别填入 ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: 构建 Android APK(必须使用发布证书)
        env:
          CCFLASH_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          # --split-per-abi: 不带该 flag 时 tauri 只构建 universal flavor(单包),
          # 重命名步骤的 flavor→ABI 映射与"按机型分架构下载"的契约会落空。
          # 正式 Release 一律拒绝 debug 兜底: debug 包 debuggable、每次签名不同无法覆盖升级,
          # 一旦以 --debug 混进公开 Release 就是用户装不上的"正式版"。缺 Secrets 直接失败。
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android 发布证书 Secrets(ANDROID_KEYSTORE_BASE64/PASSWORD/KEY_ALIAS/KEY_PASSWORD)不完整，正式 Release 拒绝以 debug 包发布"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export CC_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          export CC_KEYSTORE_PASSWORD="$KS_PASSWORD"
          export CC_KEY_ALIAS="$KEY_ALIAS"
          export CC_KEY_PASSWORD="$KEY_PASSWORD"
          npx tauri android build --apk --split-per-abi

      # --split-per-abi 构建 4 个 ABI flavor(universal 不参与 split), 见 gen/android 的 RustPlugin.kt;
      # 文件名把 flavor 名映射成标准 ABI 名 —— 用户按机型选 arm64-v8a(绝大多数)/armeabi-v7a,
      # 避免只发一个包时随机落到 x86 装到 ARM 手机上报 NO_MATCHING_ABIS
      - name: 重命名产物(flavor 名映射为标准 ABI 名)
        run: |
          set -e
          OUT_DIR=src-tauri/gen/android/app/build/outputs/apk
          found=0
          for apk in $(find "$OUT_DIR" -name "*.apk" ! -name "*unsigned*" ! -name "*-debug*" -type f | sort); do
            base=$(basename "$apk" .apk)          # app-arm64-release
            abi="${base#app-}"
            abi="${abi%-unsigned}"; abi="${abi%-debug}"; abi="${abi%-release}"
            case "$abi" in                        # flavor → 标准 ABI 名
              arm64) abi="arm64-v8a" ;;
              arm)   abi="armeabi-v7a" ;;
            esac
            dest="CC-Flash-${{ github.ref_name }}-android-${abi}.apk"
            echo "打包: $apk → $dest"
            cp "$apk" "$dest"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::error::未找到已签名的 APK"
            find "$OUT_DIR" -name "*.apk" -type f
            exit 1
          fi

      # 重跑已发布 tag 时 desktop 腿必失败, 但 android 腿仍会跑(always()) ——
      # 若不加门禁, 新 APK 会直接写进线上正式 Release, 绕过"desktop+android 全绿才发布"。
      # 草稿可写; 已公开则拒绝; 不存在(desktop 挂得早)允许软上传, 由 publish job 兜底决定公开。
      - name: 确认 Release 尚未公开(防止重跑已发布 tag 篡改线上资产)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          state=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null || echo "missing")
          if [ "$state" = "false" ]; then
            echo "::error::Release ${{ github.ref_name }} 已公开，拒绝追加/替换线上资产(重跑已发布 tag 会绕过全绿门禁)"
            exit 1
          fi
          echo "Release 状态: $state（草稿或不存在，允许上传草稿资产）"

      # 一律追加到草稿 Release; 是否公开由末尾 publish job 统一决定(desktop+android 全绿)
      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: CC-Flash-${{ github.ref_name }}-android-*.apk
          draft: true

  # ---- iOS(仅模板, 当前未交付) ----
  # 前置: ① 付费开发者账号($99/年) ② 证书.p12 与描述文件.mobileprovision 上传为仓库 Secrets
  #       (APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_PROVISIONING_PROFILE)
  # ③ 生成 gen/apple 工程并补本地网络权限(Info.plist: NSLocalNetworkUsageDescription /
  #    NSBonjourServices) ④ 适配 open_url_cmd 等壳能力(当前 iOS 明确返回不支持)
  # 全部完成后再取消注释, 并在 tauri.conf.json / gen/apple 配置签名
  # ios:
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: 20, cache: npm }
  #     - uses: dtolnay/rust-toolchain@stable
  #       with:
  #         targets: aarch64-apple-ios
  #     - uses: Swatinem/rust-cache@v2
  #     - run: npm install
  #     - run: npm run tauri ios build -- --target aarch64-apple-ios
  #     - uses: softprops/action-gh-release@v2
  #       with:
  #         files: src-tauri/target/aarch64-apple-ios/release/bundle/ios/*.ipa

  # ---- 发布: desktop + android 全绿才把草稿 Release 公开 ----
  # 各构建 job 一律先传草稿 —— 否则 mac 腿最先完成即公开, 后续任一环节失败
  # 会留下残缺的"正式版"(如只有 macOS 包), 更新检查还会把它推给全平台用户
  publish:
    needs: [desktop, android]
    # job 级只要求"没被取消"就运行 —— 全绿条件放到 step 级: 若 job 级 if 要求双
    # success, 不全绿时整个 job 被 skip, "保持草稿"的警告 step 永远不执行,
    # 草稿卡住时操作者零提示
    if: ${{ always() && (needs.desktop.result != 'cancelled' || needs.android.result != 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 发布 Release(草稿 → 正式)
        if: ${{ needs.desktop.result == 'success' && needs.android.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          set -e
          assets=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          echo "$assets"
          # 精确断言完整资产集: 只要求"至少一个"时, 部分架构/ABI 构建失败也会把残缺版本公开
          dmg_count=$(printf '%s\n' "$assets" | grep -cE '\.dmg$' || true)
          [ "$dmg_count" -ge 2 ] || { echo "::error::Release 缺少完整 macOS 双架构 dmg(当前 $dmg_count 个)"; exit 1; }
          printf '%s\n' "$assets" | grep -qE '\.(exe|msi)$' || { echo "::error::Release 缺少 Windows 安装包"; exit 1; }
          apk_count=$(printf '%s\n' "$assets" | grep -cE 'android-.*\.apk$' || true)
          [ "$apk_count" -ge 4 ] || { echo "::error::Release 缺少完整 Android 4 ABI APK(当前 $apk_count 个)"; exit 1; }
          # 未签名/未公证的包不得作为正式版公开: macOS Gatekeeper 会直接拦截,
          # Windows SmartScreen 也会警告。缺签名 Secrets 时只发布为预发布。
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$WINDOWS_CERTIFICATE" ]; then
            echo "::warning::签名 Secrets 不完整(APPLE_CERTIFICATE/WINDOWS_CERTIFICATE), 本次以预发布(prerelease)公开"
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --prerelease
            echo "✔ ${{ github.ref_name }} 已发布为预发布(未签名)"
            exit 0
          fi
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
          echo "✔ ${{ github.ref_name }} 已发布"
      - name: 未全绿时提示
        if: ${{ needs.desktop.result != 'success' || needs.android.result != 'success' }}
        run: echo "::warning::desktop(${{ needs.desktop.result }})/android(${{ needs.android.result }}) 未全部成功, Release 保持草稿 —— 修复后可重新跑本 job 或手动 Publish"
