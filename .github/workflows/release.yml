# 推送 v* 标签时自动构建多平台安装包并创建/补充 GitHub Release
# 覆盖: macOS 分架构双包(aarch64 dmg + x64 dmg) · Windows NSIS exe
#       · Android 单包 arm64-v8a .apk(覆盖 Android 7.0+ / minSdk 24 主流 64 位机型)
#       macOS 保持轻量双包(单架构安装包约为 universal 的一半);
#       Windows / Android 各一个包, 减少 Release 文件数量与用户选择成本;
#       必须配置 ANDROID_KEYSTORE_* 走 release 签名, 缺 Secrets 直接失败 ——
#       正式 Release 绝不允许 debug 包混入
# iOS: 当前未交付 —— 除 Apple 开发者账号签名外, 还需先生成 gen/apple 工程、补充本地网络权限
# (NSLocalNetworkUsageDescription/Bonjour)并适配 open_url 等壳能力; 下方 job 仅为模板
name: Release 构建

on:
  push:
    tags: ["v*"]

# 同一 tag 只允许一个运行组。重发同一 tag 时取消旧 run:
# 旧 run 可能仍拿着旧提交; 若让它先跑完, 会先公开旧资产并让新 run 在 prepare 失败。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

# GITHUB_TOKEN 默认只读, 声明 contents:write 才能创建 Release 并上传产物
permissions:
  contents: write

jobs:
  # ---- 准备: 校验版本 + 串行创建草稿 Release ----
  # 三个桌面 matrix 腿若各自 getOrCreateRelease, 可能在秒级窗口内各建一个同名草稿;
  # retryAttempts 对"都成功创建"无效。这里先单点创建/确认草稿, 后面所有腿只追加资产。
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验 tag 与 Cargo.toml 版本一致
        id: ver
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          # 四段 tag(X.Y.Z.W) 的第四段是同一应用版本内的构建号: Cargo/semver 只存前三段
          base="$tag"
          case "$tag" in *.*.*.*) base="${tag%.*}" ;; esac
          if [ "$base" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 Cargo.toml version $ver 不一致（四段 tag 前三位应等于应用版本）"
            exit 1
          fi
          # 三处版本声明必须一致(Cargo 唯一来源; 前端兜底/package.json 由 release.sh 同步)
          pkg=$(node -p "require('./package.json').version")
          fallback=$(grep -m1 'APP_VERSION_FALLBACK' src/config.js | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$pkg" != "$ver" ] || [ "$fallback" != "$ver" ]; then
            echo "::error::版本不一致: Cargo=$ver package.json=$pkg config.js=$fallback"
            exit 1
          fi
          # Android versionCode 必须与 tag 同步: 手工打 tag 时防止发布"新版本名 + 旧版本码"的 APK
          IFS=. read -r vM vN vP vB <<< "$tag"
          vB=${vB:-0}
          # 段界 0-99: 绕过 release.sh 手打 v1.100.x 会让 versionCode 与 v2.0.0 碰撞(B3-15)
          for seg in "$vM" "$vN" "$vP" "$vB"; do
            if ! [[ "$seg" =~ ^[0-9]+$ ]] || [ "$seg" -ge 100 ]; then
              echo "::error::版本段必须是 0-99 的整数: $tag"
              exit 1
            fi
          done
          expected=$((10#$vM * 10000000 + 10#$vN * 100000 + 10#$vP * 100 + 10#$vB))
          actual=$(node -p "require('./src-tauri/tauri.conf.json').bundle.android.versionCode")
          if [ "$expected" != "$actual" ]; then
            echo "::error::Android versionCode 不一致: 期望 $expected, tauri.conf.json 为 $actual（请先跑 scripts/release.sh）"
            exit 1
          fi
          # macOS CFBundleVersion 必须是三段映射 M.N.(P*100+B)(B3-5): 手打 tag 漏同步时拦截
          want_bver="$vM.$vN.$((10#$vP * 100 + 10#$vB))"
          actual_bver=$(node -p "require('./src-tauri/tauri.conf.json').bundle.macOS.bundleVersion")
          if [ "$want_bver" != "$actual_bver" ]; then
            echo "::error::macOS bundleVersion 不一致: 期望 $want_bver, tauri.conf.json 为 $actual_bver（请先跑 scripts/release.sh）"
            exit 1
          fi
          echo "版本校验通过: $GITHUB_REF_NAME (应用版本 $ver, versionCode $actual, bundleVersion $actual_bver)"
          # CCFLASH_BUILD_VERSION 只影响应用内展示: 去掉 tag 的 v 前缀,
          # 前端统一自己加 v, 避免出现 "vv1.2.4"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: 创建/确认草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          if state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/tmp/cc-release-view.err); then
            :
          else
            if grep -qiE 'not found|404' /tmp/cc-release-view.err; then
              state=missing
            else
              echo "::error::无法确认 Release 状态（网络/API/权限错误），拒绝继续"
              cat /tmp/cc-release-view.err
              exit 1
            fi
          fi
          if [ "$state" = "false" ]; then
            echo "::error::Release $tag 已公开，拒绝重跑发版"
            exit 1
          fi
          if [ "$state" = "missing" ]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
              --title "CC-Flash $tag" --notes "对应标签 $tag 的自动构建产物。"
          else
            echo "草稿 Release 已存在，直接复用"
          fi

  # ---- 桌面端: tauri-action 构建 + 向既有草稿追加资产 ----
  # 测试门禁: 39 项单测 + 前端构建, 红了就不进构建/发布(B3-13)
  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: 安装前端依赖
        run: npm ci
      - name: 前端生产构建
        run: npm run build
      - name: Rust 单测
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  desktop:
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 保持分架构双包: _aarch64.dmg(Apple Silicon) / _x64.dmg(Intel),
          # 单包体积约为 universal 的一半。Windows 只发 NSIS exe(不再发 msi)。
          - os: macos-latest
            args: --target aarch64-apple-darwin
            arch: aarch64
          - os: macos-latest
            args: --target x86_64-apple-darwin
            arch: x64
          - os: windows-latest
            args: --bundles nsis
            arch: x64-win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"   # 钉版: 浮动 stable 会在发版日因上游变化全线红(B3-14)

      - name: 安装 macOS 目标三元组(macOS)
        # 两条 mac 腿各自只构建一个架构, 两个目标都装上保持幂等
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 两腿 macos 目标不同(target 目录不同), 缓存键必须带上 arch 避免互相覆盖
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: 安装前端依赖
        run: npm ci

      # Tauri 把"存在但为空"的 APPLE_CERTIFICATE 也当作待导入证书, 空 Secret 会直接
      # 报 Unable to decode; 这里只在证书非空时写入 GITHUB_ENV, 未配置就走未签名包。
      - name: 准备可选 macOS 签名环境
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::未配置 Apple 签名证书 Secrets，本次生成未签名/未公证的 macOS 包"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<CC_EOF"
            printf '%s\n' "$APPLE_CERTIFICATE"
            echo "CC_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD<<CC_EOF"
            printf '%s\n' "$APPLE_CERTIFICATE_PASSWORD"
            echo "CC_EOF"
          } >> "$GITHUB_ENV"
          # 公证凭据必须三件套齐全才注入: 部分配置会让 Tauri 拿半套凭据去公证并失败。
          [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "已注入 Apple 签名/公证环境"
          else
            echo "::warning::公证凭据不完整（APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID），本次只签名、不公证"
          fi

      # Windows 签名: Tauri CLI 不接受 WINDOWS_CERTIFICATE 环境变量, 必须把 PFX
      # 导入证书库并把 thumbprint 通过 --config 传给 tauri。未配置时写空 args。
      - name: 准备可选 Windows 签名环境
        id: winsign
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "::notice::未配置 Windows 签名证书 Secrets，本次生成未签名 exe"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "ccflash-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pwd = if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            New-Object System.Security.SecureString
          } else {
            ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          }
          $cert = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd)[0]
          if (-not $cert) { throw "PFX 导入失败" }
          $cfg = Join-Path $env:RUNNER_TEMP "windows-sign.json"
          $json = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText($cfg, $json, [Text.UTF8Encoding]::new($false))
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "args=--config `"$cfg`"`n", [Text.UTF8Encoding]::new($false))
          Write-Host "已导入 Windows 签名证书 $($cert.Thumbprint)"

      # 与 Android 腿同款门禁: tauri-action 按 tag 匹配 Release 时不校验 draft,
      # 重跑 desktop job 会复用已公开 Release 并 delete/replace 其资产,
      # 绕过"desktop+android 全绿才发布"的承诺(审查 B3-2)
      - name: 确认 Release 尚未公开(防止重跑已发布 tag 篡改线上资产)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if state=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/tmp/cc-release-desktop.err); then
            :
          else
            if grep -qiE 'not found|404' /tmp/cc-release-desktop.err; then
              state=missing
            else
              echo "::error::无法确认 Release 状态（网络/API/权限错误），拒绝上传"
              cat /tmp/cc-release-desktop.err
              exit 1
            fi
          fi
          if [ "$state" = "false" ]; then
            echo "::error::Release ${{ github.ref_name }} 已公开，拒绝追加/替换线上资产(重跑已发布 tag 会绕过全绿门禁)"
            exit 1
          fi
          echo "Release 状态: $state（草稿或不存在，允许上传草稿资产）"

      # tauri-action: vite build → cargo build --release → 打包 → 上传到 Release
      # tagName 对应已推送的标签, Release 不存在则自动创建(草稿)。
      # 一律先传草稿, 由末尾 publish job 在 desktop+android 全绿后统一发布 ——
      # 否则 mac 腿 releaseDraft:false 完成即公开, Windows 挂掉时用户看到没有 Windows 包的"正式版"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内展示/更新比较使用完整四段版本(本地构建回退 Cargo 三段)
          CCFLASH_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          # Apple/Windows 签名变量均由上方步骤按需注入 GITHUB_ENV, 不直接传空 Secret
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CC-Flash ${{ github.ref_name }}"
          releaseBody: "对应标签 ${{ github.ref_name }} 的自动构建产物。更新说明见 Release 描述。"
          releaseDraft: true
          prerelease: false
          # 桌面矩阵并发 getOrCreateRelease 竞态兜底: 两腿几乎同时完成时可能都"没查到
          # draft 就去创建" → 422 或拆成两个 draft; 重试会重新 list 找到已建好的 draft
          retryAttempts: 3
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.args }}

      # 产物版本与 tag 一致才准进入签名/上传: 手打 tag 漏同步时在本机拦截(B3-10)
      - name: 构建产物版本断言(CFBundleVersion/文件版本)
        shell: bash
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          base="$tag"
          case "$tag" in *.*.*.*) base="${tag%.*}" ;; esac
          IFS=. read -r vM vN vP vB <<< "$tag"
          vB=${vB:-0}
          want_bver="$vM.$vN.$((10#$vP * 100 + 10#$vB))"
          case "$RUNNER_OS" in
            macOS)
              app=$(find src-tauri/target -name "*.app" -type d -maxdepth 7 | grep -v '\.app/Contents' | head -1)
              [ -n "$app" ] || { echo "::error::未找到构建产物 .app"; exit 1; }
              bv=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Contents/Info.plist")
              sv=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
              if [ "$bv" != "$want_bver" ]; then echo "::error::CFBundleVersion=$bv 期望 $want_bver"; exit 1; fi
              if [ "$sv" != "$base" ]; then echo "::error::CFBundleShortVersionString=$sv 期望 $base"; exit 1; fi
              echo "macOS 版本断言通过: $sv ($bv)"
              ;;
            Windows)
              exe=$(find src-tauri/target -name "*-setup.exe" -type f | head -1)
              [ -n "$exe" ] || { echo "::error::未找到 NSIS exe"; exit 1; }
              powershell -NoProfile -Command "\$v=(Get-Item '$exe').VersionInfo; Write-Host "FileVersion=\$(\$v.FileVersion) ProductVersion=\$(\$v.ProductVersion)"; if (\$(\$v.FileVersion) -notlike '$base*') { Write-Error "FileVersion 不匹配期望 $base*"; exit 1 }"
              echo "Windows 版本断言通过"
              ;;
          esac

      # 证书存在不等于产物真的签名/公证成功：构建后再验一次，失败就让 job 红掉，
      # 避免把 Gatekeeper/SmartScreen 打不开的包交给 publish。
      - name: 校验 macOS 签名/公证
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::未配置 Apple 证书，跳过签名校验（publish 会继续发布未签名包）"
            exit 0
          fi
          APP=$(find src-tauri/target -path '*/release/bundle/macos/*.app' -type d | head -1)
          DMG=$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' -type f | head -1)
          [ -n "$APP" ] || { echo "::error::未找到 macOS .app"; exit 1; }
          codesign --verify --deep --strict "$APP"
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            # Tauri 2 默认把公证票据 stapling 到 .app; 先验 app, 兼容也 stapling DMG 的构建
            if ! xcrun stapler validate "$APP"; then
              [ -n "$DMG" ] && xcrun stapler validate "$DMG"
            fi
            echo "✔ macOS 签名/公证校验通过"
          else
            echo "::warning::已签名但缺少公证凭据（APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID），跳过 stapler；本次发布未公证"
          fi

      - name: 校验 Windows Authenticode
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "::notice::未配置 Windows 证书，跳过签名校验（publish 会继续发布未签名包）"
            exit 0
          }
          $exe = Get-ChildItem -Path src-tauri/target -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw '未找到 Windows NSIS exe' }
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Windows 签名无效: $($sig.Status) $($sig.StatusMessage)" }
          Write-Host "✔ Windows Authenticode 校验通过"

      # 四段 tag(vX.Y.Z.W) 的第四段是构建号, 但 Tauri 应用版本必须是 semver(仅三段),
      # bundle 默认文件名只带 1.2.7。这里把本地产物复制成四段名(与 tag 完全一致),
      # 删除默认名资产后重新上传; 三段 tag 时新旧名相同, 直接跳过。
      - name: 资产名补齐四段构建号
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUILDVER: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # 改名步骤同样可能被单独重跑: 已公开则拒绝 delete-asset/clobber(审查 B3-2)
          st=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null) \
            || { echo "::error::无法确认 Release 状态，拒绝改名"; exit 1; }
          if [ "$st" = "false" ]; then
            echo "::error::Release 已公开，拒绝替换线上资产(重跑已发布 tag)"
            exit 1
          fi
          APPVER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$BUILDVER" = "$APPVER" ]; then
            echo "三段 tag(v$BUILDVER), 资产名无需调整"
            exit 0
          fi
          case "$RUNNER_OS" in
            macOS)   pattern='*/release/bundle/dmg/*.dmg' ;;
            Windows) pattern='*/release/bundle/nsis/*.exe' ;;
            *)       exit 0 ;;
          esac
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find src-tauri/target -path "$pattern" -type f -print0)
          [ ${#files[@]} -gt 0 ] || { echo "::error::未找到待改名的产物($pattern)"; exit 1; }
          for f in "${files[@]}"; do
            old=$(basename "$f")
            new=${old//"_${APPVER}_"/"_${BUILDVER}_"}
            if [ "$old" = "$new" ]; then echo "跳过 $old"; continue; fi
            cp "$f" "$RUNNER_TEMP/$new"
            gh release delete-asset "$TAG" "$old" --yes
            gh release upload "$TAG" "$RUNNER_TEMP/$new" --clobber
            echo "✔ $old → $new"
          done

  # ---- Android: arm64-v8a 单包(必须用发布证书 Secrets 走 release 签名; 缺失则 job 失败) ----
  android:
    needs: [prepare, desktop]   # 草稿已由 prepare 串行建好, 再追加 APK 资产
    # desktop 任一平台失败不连坐 APK 发布; prepare 失败则不再上传; 用户手动取消时不跑
    if: ${{ always() && needs.prepare.result == 'success' && needs.desktop.result != 'cancelled' }}
    runs-on: ubuntu-latest  # runner 自带 Android SDK
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"   # 钉版: 浮动 stable 会在发版日因上游变化全线红(B3-14)
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: 接受 Android SDK 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: 安装/定位固定版本 Android NDK
        # 不取 runner 上的"最新"版本(head-1 会拿最旧, sort|tail 又随镜像漂移):
        # 显式固定 NDK, 与 Gradle ndkVersion(跟随 NDK_HOME)和 Rust 侧编译保持一致
        run: |
          set -e
          NDK_VERSION=27.2.12479018
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        run: npm ci

      - name: 初始化 Android 工程(首次)
        if: ${{ ! hashFiles('src-tauri/gen/android/**') }}
        run: npm run tauri android init

      # Android 构建与签名(签名配置已随 src-tauri/gen/android 入库, 见 app/build.gradle.kts 的
      # signingConfigs.release, 读 CC_KEYSTORE_* 环境变量):
      # - 有发布证书 Secrets → 导出环境变量, --release 构建(固定证书, 版本间可覆盖安装, 无 debuggable)
      # - 未配置 → 退回 --debug(debug keystore 自动签名, 可直接安装但各版本证书不同, CI 出警告)
      # Secrets 生成方式(本地执行一次, 妥善备份 keystore, 丢了将无法覆盖安装升级):
      #   keytool -genkeypair -v -keystore cc-flash.keystore -alias ccflash \
      #     -keyalg RSA -keysize 2048 -validity 10950
      #   base64 -i cc-flash.keystore | pbcopy   # → ANDROID_KEYSTORE_BASE64
      #   密码/别名分别填入 ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: 构建 Android APK(必须使用发布证书)
        env:
          CCFLASH_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          # 单包 arm64-v8a: 覆盖 Android 7.0+(minSdk 24) 主流 64 位机型, 不再发 4 个 ABI 分包。
          # 正式 Release 一律拒绝 debug 兜底: debug 包 debuggable、每次签名不同无法覆盖升级,
          # 一旦以 --debug 混进公开 Release 就是用户装不上的"正式版"。缺 Secrets 直接失败。
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android 发布证书 Secrets(ANDROID_KEYSTORE_BASE64/PASSWORD/KEY_ALIAS/KEY_PASSWORD)不完整，正式 Release 拒绝以 debug 包发布"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export CC_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          export CC_KEYSTORE_PASSWORD="$KS_PASSWORD"
          export CC_KEY_ALIAS="$KEY_ALIAS"
          export CC_KEY_PASSWORD="$KEY_PASSWORD"
          npx tauri android build --apk --target aarch64

      # 只构建 arm64-v8a 一个 flavor; 文件名仍映射为标准 ABI 名, 方便用户确认机型
      - name: 重命名产物(arm64-v8a)
        run: |
          set -e
          OUT_DIR=src-tauri/gen/android/app/build/outputs/apk
          found=0
          for apk in $(find "$OUT_DIR" -name "*.apk" ! -name "*unsigned*" ! -name "*-debug*" -type f | sort); do
            base=$(basename "$apk" .apk)          # app-arm64-release
            abi="${base#app-}"
            abi="${abi%-unsigned}"; abi="${abi%-debug}"; abi="${abi%-release}"
            case "$abi" in                        # flavor → 标准 ABI 名
              arm64) abi="arm64-v8a" ;;
              arm)   abi="armeabi-v7a" ;;
              # 当前只跑 `--target aarch64`, Tauri 产物名是 app-universal-release.apk,
              # 但包内只有 lib/arm64-v8a; 统一按 arm64-v8a 命名, 避免 Release 资产名误导。
              universal) abi="arm64-v8a" ;;
            esac
            dest="CC-Flash-${{ github.ref_name }}-android-${abi}.apk"
            echo "打包: $apk → $dest"
            cp "$apk" "$dest"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::error::未找到已签名的 APK"
            find "$OUT_DIR" -name "*.apk" -type f
            exit 1
          fi

      - name: 构建产物版本断言(versionCode/versionName)
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          base="$tag"
          case "$tag" in *.*.*.*) base="${tag%.*}" ;; esac
          IFS=. read -r vM vN vP vB <<< "$tag"
          vB=${vB:-0}
          want_vc=$((10#$vM * 10000000 + 10#$vN * 100000 + 10#$vP * 100 + 10#$vB))
          apk=$(ls CC-Flash-*-android-arm64-v8a.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort | tail -1)
          [ -n "$AAPT" ] || { echo "::error::未找到 aapt"; exit 1; }
          bad=$("$AAPT" dump badging "$apk" | head -1)
          echo "$bad"
          echo "$bad" | grep -q "versionCode='$want_vc'" || { echo "::error::APK versionCode 与 tag 不符(期望 $want_vc)"; exit 1; }
          echo "$bad" | grep -q "versionName='$base'" || { echo "::error::APK versionName 与应用版本不符(期望 $base)"; exit 1; }
          echo "Android 版本断言通过"

      # 重跑已发布 tag 时 desktop 腿必失败, 但 android 腿仍会跑(always()) ——
      # 若不加门禁, 新 APK 会直接写进线上正式 Release, 绕过"desktop+android 全绿才发布"。
      # 草稿可写; 已公开则拒绝; 不存在(desktop 挂得早)允许软上传, 由 publish job 兜底决定公开。
      - name: 确认 Release 尚未公开(防止重跑已发布 tag 篡改线上资产)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if state=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/tmp/cc-release-android.err); then
            :
          else
            if grep -qiE 'not found|404' /tmp/cc-release-android.err; then
              state=missing
            else
              echo "::error::无法确认 Release 状态（网络/API/权限错误），拒绝上传"
              cat /tmp/cc-release-android.err
              exit 1
            fi
          fi
          if [ "$state" = "false" ]; then
            echo "::error::Release ${{ github.ref_name }} 已公开，拒绝追加/替换线上资产(重跑已发布 tag 会绕过全绿门禁)"
            exit 1
          fi
          echo "Release 状态: $state（草稿或不存在，允许上传草稿资产）"

      # 一律追加到草稿 Release; 是否公开由末尾 publish job 统一决定(desktop+android 全绿)
      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: CC-Flash-${{ github.ref_name }}-android-*.apk
          draft: true

  # ---- iOS(仅模板, 当前未交付) ----
  # 前置: ① 付费开发者账号($99/年) ② 证书.p12 与描述文件.mobileprovision 上传为仓库 Secrets
  #       (APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_PROVISIONING_PROFILE)
  # ③ 生成 gen/apple 工程并补本地网络权限(Info.plist: NSLocalNetworkUsageDescription /
  #    NSBonjourServices) ④ 适配 open_url_cmd 等壳能力(当前 iOS 明确返回不支持)
  # 全部完成后再取消注释, 并在 tauri.conf.json / gen/apple 配置签名
  # ios:
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  #     - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
  #       with: { node-version: 20, cache: npm }
  #     - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
  #       with:
  #         targets: aarch64-apple-ios
  #     - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
  #     - run: npm ci
  #     - run: npm run tauri ios build -- --target aarch64-apple-ios
  #     - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
  #       with:
  #         files: src-tauri/target/aarch64-apple-ios/release/bundle/ios/*.ipa

  # ---- 发布: desktop + android 全绿才把草稿 Release 公开 ----
  # 各构建 job 一律先传草稿 —— 否则 mac 腿最先完成即公开, 后续任一环节失败
  # 会留下残缺的"正式版"(如只有 macOS 包), 更新检查还会把它推给全平台用户
  publish:
    needs: [desktop, android]
    # job 级只要求"没被取消"就运行 —— 全绿条件放到 step 级: 若 job 级 if 要求双
    # success, 不全绿时整个 job 被 skip, "保持草稿"的警告 step 永远不执行,
    # 草稿卡住时操作者零提示
    if: ${{ always() && (needs.desktop.result != 'cancelled' || needs.android.result != 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 发布 Release(草稿 → 正式)
        if: ${{ needs.desktop.result == 'success' && needs.android.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          # publish 也可能是 job 级重跑: 已公开的 Release 不再重写状态/正文/资产(审查 B3-2)
          st=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/tmp/cc-release-pub.err) \
            || { echo "::error::无法确认 Release 状态，拒绝发布"; cat /tmp/cc-release-pub.err; exit 1; }
          if [ "$st" = "false" ]; then
            echo "::error::Release ${{ github.ref_name }} 已公开，拒绝重跑 publish(会改写线上状态/正文)"
            exit 1
          fi
          assets=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          echo "$assets"
          # 精确断言完整资产集: 只要求"至少一个"时, 部分架构/ABI 构建失败也会把残缺版本公开
          dmg_count=$(printf '%s\n' "$assets" | grep -cE '\.dmg$' || true)
          [ "$dmg_count" -ge 2 ] || { echo "::error::Release 缺少完整 macOS 双架构 dmg(当前 $dmg_count 个)"; exit 1; }
          printf '%s\n' "$assets" | grep -qE '\.exe$' || { echo "::error::Release 缺少 Windows NSIS exe"; exit 1; }
          apk_count=$(printf '%s\n' "$assets" | grep -cE 'android-.*\.apk$' || true)
          [ "$apk_count" -ge 1 ] || { echo "::error::Release 缺少 Android arm64 APK(当前 $apk_count 个)"; exit 1; }
          # 缺签名证书时不再阻断发布(与 v1.2.5 之前的流程一致): 只打 warning,
          # 继续发布未签名/未公证包。维护者需在 Release 说明中注明 macOS 右键打开、
          # Windows SmartScreen。有证书时 desktop job 已做 codesign/stapler/Authenticode 复核。
          missing=""
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            missing="$missing Apple(证书/ID/专用密码/Team)"
          fi
          if [ -z "$WINDOWS_CERTIFICATE" ] || [ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            missing="$missing Windows(证书/密码)"
          fi
          if [ -n "$missing" ]; then
            echo "::warning::缺少签名/公证 Secrets:$missing。本次发布未签名/未公证包，请在 Release 说明中注明打开方式"
            echo "::warning::未签名 Release 将标记为 prerelease：应用内更新检查仍会显示该版本并标注未签名风险（与 README 口径一致），由用户决定是否下载"
          fi
          # 精确校验本次 tag 的完整资产集，不只数扩展名：避免复用草稿里的旧架构/旧提交。
          # 四段 tag(vX.Y.Z.W) 的构建号会由 desktop/android job 补进文件名:
          # dmg/exe 在 desktop 尾部改名为完整 tag 版本, APK 由 android job 用完整 tag 重命名;
          # 因此四项都以 tagver 校验, 不再假设 Tauri 产物名只带前三段。
          tagver="${GITHUB_REF_NAME#v}"
          for want in "CC-Flash_${tagver}_aarch64.dmg" "CC-Flash_${tagver}_x64.dmg" "CC-Flash_${tagver}_x64-setup.exe" "CC-Flash-v${tagver}-android-arm64-v8a.apk"; do
            printf '%s\n' "$assets" | grep -Fxq "$want" || { echo "::error::Release 缺少资产 $want"; exit 1; }
          done
          # 清理 tauri-action 顺带上传的非必需资产(无版本号 .app.tar.gz 等):
          # 用户会误当安装包下载, 且与 README 只列 dmg/exe/apk 的口径不符(B3-11)
          allowed="CC-Flash_${tagver}_aarch64.dmg CC-Flash_${tagver}_x64.dmg CC-Flash_${tagver}_x64-setup.exe CC-Flash-v${tagver}-android-arm64-v8a.apk"
          for a in $assets; do
            keep=0
            for w in $allowed; do [ "$a" = "$w" ] && keep=1; done
            if [ "$keep" = "0" ]; then
              echo "清理非必需资产: $a"
              gh release delete-asset "${{ github.ref_name }}" "$a" --yes || true
            fi
          done
          if [ -n "$missing" ]; then
            # 把打开方式写进 Release 正文, 而不是只在日志里提醒维护者
            notes="$RUNNER_TEMP/ccflash-release-notes.md"
            # 拉取正文失败必须中止: 旧实现 `|| true` 会让 notes 为空, 随后
            # --notes-file 把原 Release 说明整个清空(审查 B3-3)
            if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json body -q .body > "$notes" 2>/tmp/cc-release-notes.err; then
              echo "::error::拉取 Release 正文失败，拒绝继续(避免清空说明)"
              cat /tmp/cc-release-notes.err
              exit 1
            fi
            # 确定性替换: 先删除历次自动追加的说明块(--- 引导、首行含"未签名/未公证构建"
            # 的连续引用行), 再写入现行文案 —— 关键词 grep 跳过会把旧版错误文案永久保留。
            # 脚本独立成文件: 内嵌 heredoc 的正文会破坏 YAML 缩进(实测 v1.3.0 首跑 parse 失败)
            python3 scripts/append-unsigned-notes.py "$notes"
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file "$notes"
            # 公开但标记 prerelease: 更新检查(自动与手动)都会显示该版本并标注风险, 由用户决定是否下载
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --prerelease
            echo "✔ ${{ github.ref_name }} 已公开发布（prerelease：未签名/未公证，已写入打开说明）"
          else
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
            echo "✔ ${{ github.ref_name }} 已发布"
          fi
      - name: 未全绿时提示
        if: ${{ needs.desktop.result != 'success' || needs.android.result != 'success' }}
        run: echo "::warning::desktop(${{ needs.desktop.result }})/android(${{ needs.android.result }}) 未全部成功, Release 保持草稿 —— 修复后可重新跑本 job 或手动 Publish"
